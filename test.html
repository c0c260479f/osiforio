<style>
:root { --bg: #fbfaf7; --ink: #1d1b18; --muted: #6b665e; --line: #e2ddd3; --accent: #c92f65; --on-accent: #ffffff; --card: #ffffff; }
@media (prefers-color-scheme: dark) { :root { --bg: #151412; --ink: #f2efe9; --muted: #a59f95; --line: #34312c; --accent: #ff7aa6; --on-accent: #1d1b18; --card: #1d1b18; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.6; }
main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 22px; margin: 0 0 8px; }
h2 { font-size: 17px; margin: 0 0 4px; }
h3 { font-size: 16px; margin: 28px 0 8px; }

.lead { color: var(--muted); margin: 0 0 24px; font-size: 14.5px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.meta { color: var(--muted); font-size: 13.5px; margin: 0 0 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { appearance: none; border: 1px solid var(--line); border-radius: 999px; padding: 10px 18px; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none; display: inline-block; background: transparent; color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.status { font-size: 13px; color: var(--muted); min-height: 1.2em; margin: 8px 0 0; }
textarea { width: 100%; margin-top: 8px; font: 12px/1.4 ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); color: var(--ink); }
ol { padding-left: 1.4em; margin: 0; }
li { margin-bottom: 6px; }
</style>

<main>
<h1>実機テスト用ページ</h1>
<p class="lead">共有リンクが長くても開けるか、記録が残るかを確かめるためのページです。ここにあるリストは、すべて架空のものです。</p>
<div id="cards"></div>
<h3>確かめる手順</h3>
<ol>
<li>「開く」を押して、リストの名前が出るかを見る。出たら「保存」を押す。</li>
<li>項目を2つチェックする。</li>
<li>ブラウザを閉じてから、<a href="./">追いつきリストのトップ</a>を開き直し、チェックが残っているかを見る。</li>
<li>「リンクをコピー」を押し、LINEやXで自分あてに送る。届いたリンクを、そのアプリの中で開けるかを見る。</li>
</ol>
</main>

const cards = document.getElementById('cards');
LISTS.forEach(l => {
  const url = new URL('./#list=' + l.code, location.href).href;
  const card = document.createElement('section');
  card.className = 'card';
  card.innerHTML = '<h2>' + l.label + 'リスト（' + l.n + '項目）</h2>'
    + '<p class="meta">リンクの長さ：約' + url.length.toLocaleString('ja-JP') + '文字</p>'
    + '<div class="row"><a class="btn primary" data-open>開く</a><button class="btn" type="button" data-copy>リンクをコピー</button></div>'
    + '<p class="status" aria-live="polite"></p>';
  card.querySelector('[data-open]').href = url;
  const status = card.querySelector('.status');
  card.querySelector('[data-copy]').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(url);
      status.textContent = 'コピーしました。LINEやXに貼り付けて、自分あてに送ってください。';
    } catch (e) {
      let ta = card.querySelector('textarea');
      if (!ta) { ta = document.createElement('textarea'); ta.rows = 4; ta.readOnly = true; ta.value = url; card.appendChild(ta); }
      ta.focus(); ta.select();
      status.textContent = '自動でコピーできませんでした。下の文字をすべて選んで、コピーしてください。';
    }
  });
  cards.appendChild(card);
});
</script>
